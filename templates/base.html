<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Thai License Plate Detection{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <h1>🚗 Thai License Plate Detection</h1>
    </nav>
    
    <div class="container">
        {% if upload_error %}
        <div class="alert alert-error" role="alert">{{ upload_error }}</div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    
    <footer>
        <p>Thai License Plate Detection — Classical Computer Vision</p>
    </footer>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
