{% extends "base.html" %}

{% block content %}
<div class="card">
    <form id="uploadForm" action="/process" method="POST" enctype="multipart/form-data">
        <div class="upload-area" id="uploadArea">
            <div id="uploadPrompt">
                <h3 style="margin-top: 0;">อัปโหลดรูปภาพป้ายทะเบียน</h3>
                <p style="color: var(--text-light); margin-bottom: 1.5rem;">ลากและวางรูปภาพที่นี่ หรือคลิกเพื่อเลือกไฟล์ (JPG, PNG)</p>
                <div class="btn btn-secondary">เลือกไฟล์</div>
            </div>
            
            <img id="previewImage" class="preview-image" alt="Preview">
            <div id="fileInfo" style="display: none; margin-top: 1rem; color: var(--text-light);"></div>
            
            <input type="file" id="fileInput" name="image" accept="image/jpeg,image/png" style="display: none;">
        </div>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <button type="submit" id="submitBtn" class="btn btn-primary" style="display: none; width: 100%; max-width: 300px;">วิเคราะห์รูปภาพ</button>
        </div>
    </form>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">กำลังประมวลผล...</div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewImage = document.getElementById('previewImage');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const fileInfo = document.getElementById('fileInfo');

    // Make the upload area clickable
    uploadArea.addEventListener('click', () => {
        fileInput.click();
    });

    // Handle drag and drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
            fileInput.files = e.dataTransfer.files;
        }
    });

    // Handle file selection
    fileInput.addEventListener('change', (e) => {
        if (fileInput.files.length > 0) {
            handleFile(fileInput.files[0]);
        }
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            alert('กรุณาอัปโหลดไฟล์รูปภาพเท่านั้น');
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            alert('ขนาดไฟล์ต้องไม่เกิน 10MB');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            previewImage.src = e.target.result;
            previewImage.style.display = 'block';
            uploadPrompt.style.display = 'none';
            submitBtn.style.display = 'inline-block';
            
            // Show file info
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.textContent = `${file.name} (${sizeMB} MB)`;
            fileInfo.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    // Handle form submit
    uploadForm.addEventListener('submit', (e) => {
        if (fileInput.files.length === 0) {
            e.preventDefault();
            alert('กรุณาเลือกรูปภาพก่อนวิเคราะห์');
            return;
        }
        loadingOverlay.style.display = 'flex';
    });
});
</script>
{% endblock %}
